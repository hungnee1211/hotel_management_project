services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
      POSTGRES_DB: hotel_management
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hotel_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel_management"]
      interval: 5s
      retries: 10
volumes:
  hotel_pg:
